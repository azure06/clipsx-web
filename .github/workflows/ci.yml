name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:migrations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run supabase:start
      - run: npm run supabase:reset
      - run: npm run test:db
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/test-database-baseline.py --advisors
      - name: Preserve released migration history
        if: ${{ vars.MIGRATION_BASE_REF != '' }}
        env:
          MIGRATION_BASE_REF: ${{ vars.MIGRATION_BASE_REF }}
        run: node scripts/verify-migration-history.mjs --base "$MIGRATION_BASE_REF"
